<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Builders Daily</title>
    <link rel="stylesheet" href="./styles.css?v=20260602w" />
  </head>
  <body>
    <div class="app-shell">
      <main class="content-shell">
        <header class="content-header">
          <div class="content-header-main">
            <h2 id="pageTitle">Follow Builders</h2>
            <div class="calendar-dropdown" id="calendarDropdown">
              <button class="content-header-date-button" id="contentHeaderDateButton" type="button" aria-haspopup="dialog" aria-expanded="false">
                <span class="content-header-date" id="contentHeaderDate">--</span>
              </button>
              <div class="calendar-popover" id="calendarPopover" hidden>
                <section class="calendar-panel">
                  <div class="month-bar">
                    <button class="month-button" id="prevMonth" type="button" aria-label="Previous month">&lt;</button>
                    <div>
                      <p class="month-label" id="monthLabel">Loading</p>
                      <p class="month-subtitle" id="monthSubtitle">Choose a day</p>
                    </div>
                    <button class="month-button" id="nextMonth" type="button" aria-label="Next month">&gt;</button>
                  </div>
                  <div class="weekday-row" id="weekdayRow"></div>
                  <div class="calendar-grid" id="calendarGrid"></div>
                </section>
              </div>
            </div>
          </div>
        </header>

        <section class="cards-grid" id="cardsGrid"></section>
      </main>

      <aside class="detail-rail">
        <div class="detail-rail-scroll">
          <div class="detail-panel">
            <div class="detail-panel-head">
              <h2 class="detail-title" id="railTitle">Overview</h2>
              <div class="detail-language-toggle" role="tablist" aria-label="Overview language">
                <button class="detail-language-button is-active" id="overviewZhButton" type="button">中</button>
                <button class="detail-language-button" id="overviewEnButton" type="button">En</button>
              </div>
            </div>
            <div class="detail-summary-card is-zh" id="railSummaryCard">
              <div class="detail-summary-face" id="railSummaryZh">
                <p class="detail-summary-line">Loading digest...</p>
              </div>
              <div class="detail-summary-face detail-summary-face-back" id="railSummaryEn">
                <p class="detail-summary-line">Loading digest...</p>
              </div>
            </div>
            <div class="detail-status">
              <span class="meta-chip" id="selectedDateChip">--</span>
              <span class="meta-chip subtle" id="selectedCountChip">0 cards</span>
            </div>
          </div>

          <div class="detail-panel detail-panel-secondary">
            <p class="detail-kicker">Sources</p>
            <div class="source-group">
              <div class="source-group-head">
                <span class="source-group-title">Blogs</span>
                <span class="source-group-count" id="sourceBlogCount">0</span>
              </div>
              <div class="source-inline-list" id="sourceBlogList"></div>
            </div>

            <div class="source-group">
              <div class="source-group-head">
                <span class="source-group-title">Podcasts</span>
                <span class="source-group-count" id="sourcePodcastCount">0</span>
              </div>
              <div class="source-inline-list" id="sourcePodcastList"></div>
            </div>

            <div class="source-group">
              <div class="source-group-head">
                <span class="source-group-title">X</span>
                <span class="source-group-count" id="sourceXCount">0</span>
              </div>
              <div class="source-inline-list" id="sourceXList"></div>
              <button class="source-more-button" id="sourceXToggle" type="button" hidden>Show more</button>
            </div>

            <p class="detail-source-footnote">Thanks to <a href="https://github.com/zarazhangrui/follow-builders" target="_blank" rel="noreferrer">zarazhangrui/follow-builders</a></p>
          </div>
        </div>
      </aside>
    </div>

    <template id="cardTemplate">
      <article class="digest-card">
        <div class="card-top">
          <div class="avatar" data-avatar></div>
          <div class="profile-block">
            <a class="profile-name" data-profile-link target="_blank" rel="noreferrer"></a>
            <p class="profile-identity" data-profile-identity></p>
            <p class="profile-meta" data-profile-meta></p>
          </div>
        </div>
        <div class="card-body">
          <h3 class="card-title" data-card-title></h3>
          <div class="x-original-card" data-x-original hidden></div>
          <div class="summary-block" data-summary-block hidden>
            <div class="summary-label">Summary / 摘要</div>
            <div class="summary-text" data-card-body></div>
          </div>
          <div class="card-copy" data-card-body-fallback></div>
          <div class="card-media" data-card-media hidden></div>
          <div class="card-links" data-card-links></div>
        </div>
      </article>
    </template>

    <script type="module" src="./app.js?v=20260602w"></script>
  </body>
</html>
